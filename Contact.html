<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Northstar Studio - Contact</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="logo">Northstar Studio</a>

    <nav class="navigation">
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <main>

    <section class="page-header">
      <p class="eyebrow">Contact Us</p>

      <h1>Have a good project?</h1>

      <p class="intro-text">
        Tell us about your project and how we can help.
      </p>
    </section>

    <section class="section">
      <div class="two-column">

        <!-- Contact form -->
        <form class="card contact-form">

          <label for="name">Your Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
          >

          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
          >

          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Write your message"
          ></textarea>

          <button type="submit" class="button primary-button">
            Send Message
          </button>

        </form>

        <!-- Contact information -->
        <div class="contact-information">
          <p class="eyebrow">Email Us</p>

          <h2>hello@northstar.example</h2>

          <p>
            We usually respond within two working days.
          </p>
        </div>

      </div>
    </section>

  </main>

  <footer class="footer">
    <p>© 2026 Northstar Studio</p>
    <a href="index.html">Back to Home</a>
  </footer>

</body>
</html>
